# The gallery's one vhost file: the port-80 VirtualHost, which sends every request on to
# https, and the port-443 site, with Laravel's public/ folder as the document root and PHP
# handled by the PHP-FPM setup Apache already has for every site. Every deploy
# (scripts/deploy.ps1) fills in __SERVER_NAME__, __SERVER_ADMIN__, __WEB_ROOT__ and
# __CERT_NAME__ from its settings and installs the file as
# /etc/apache2/sites-available/<__SERVER_NAME__>.conf, retiring any other enabled site that
# serves the name (certbot's -le-ssl file, say) and keeping the previous files if
# `apachectl configtest` refuses this one.
#
# __CERT_NAME__ is a folder under /etc/letsencrypt/live whose certificate covers
# __SERVER_NAME__.

<VirtualHost *:80>
    DocumentRoot "__WEB_ROOT__/public"
    ServerName __SERVER_NAME__
    ServerAdmin __SERVER_ADMIN__
    <Directory "__WEB_ROOT__/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
    <IfModule mod_dir.c>
        DirectoryIndex index.php index.pl index.cgi index.html index.xhtml index.htm
    </IfModule>
    <IfModule mod_expires.c>
        ExpiresActive on
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/vnd.microsoft.icon "access plus 1 month"
        ExpiresByType image/x-icon "access plus 1 month"
        ExpiresByType image/webp "access plus 1 month"
        ExpiresByType video/webm "access plus 1 month"
        ExpiresByType video/mp4 "access plus 1 month"
    </IfModule>
    Protocols h2 h2c http/1.1
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =__SERVER_NAME__
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    DocumentRoot "__WEB_ROOT__/public"
    ServerName __SERVER_NAME__
    ServerAdmin __SERVER_ADMIN__
    <Directory "__WEB_ROOT__/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
    <IfModule mod_dir.c>
        DirectoryIndex index.php index.pl index.cgi index.html index.xhtml index.htm
    </IfModule>
    <IfModule mod_expires.c>
        ExpiresActive on
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/vnd.microsoft.icon "access plus 1 month"
        ExpiresByType image/x-icon "access plus 1 month"
        ExpiresByType image/webp "access plus 1 month"
        ExpiresByType video/webm "access plus 1 month"
        ExpiresByType video/mp4 "access plus 1 month"
    </IfModule>
    Protocols h2 h2c http/1.1
    RewriteEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__CERT_NAME__/privkey.pem
</VirtualHost>
</IfModule>
