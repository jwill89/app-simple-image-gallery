# The gallery's VirtualHost on port 80, which sends every request on to https. Every
# deploy (scripts/deploy.ps1) fills in __SERVER_NAME__, __SERVER_ADMIN__ and
# __APP_ROOT__ from its settings and installs the file where it differs, keeping the
# one before if `apachectl configtest` refuses this one. The VirtualHost on port 443 is
# gallery-https.conf.

<VirtualHost *:80>
    DocumentRoot "__APP_ROOT__/public"
    ServerName __SERVER_NAME__
    ServerAdmin __SERVER_ADMIN__
    <Directory "__APP_ROOT__/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
    <IfModule mod_dir.c>
        DirectoryIndex index.php index.pl index.cgi index.html index.xhtml index.htm
    </IfModule>
    <IfModule mod_expires.c>
        ExpiresActive on
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/vnd.microsoft.icon "access plus 1 month"
        ExpiresByType image/x-icon "access plus 1 month"
        ExpiresByType image/webp "access plus 1 month"
        ExpiresByType video/webm "access plus 1 month"
        ExpiresByType video/mp4 "access plus 1 month"
    </IfModule>
    Protocols h2 h2c http/1.1
    RewriteEngine on
    RewriteCond %{SERVER_NAME} =__SERVER_NAME__
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
