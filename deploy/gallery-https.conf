# The gallery's VirtualHost on port 443: Laravel's public/ folder as the document root,
# with PHP handled by the PHP-FPM setup Apache already has for every site. Every deploy
# (scripts/deploy.ps1) fills in __SERVER_NAME__, __SERVER_ADMIN__, __APP_ROOT__ and
# __CERT_NAME__ from its settings and installs the file where it differs, keeping the one
# before if `apachectl configtest` refuses this one. The VirtualHost on port 80 is
# gallery-http.conf.
#
# __CERT_NAME__ is a folder under /etc/letsencrypt/live whose certificate covers
# __SERVER_NAME__.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    DocumentRoot "__APP_ROOT__/public"
    ServerName __SERVER_NAME__
    ServerAdmin __SERVER_ADMIN__
    <Directory "__APP_ROOT__/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
    <IfModule mod_dir.c>
        DirectoryIndex index.php index.pl index.cgi index.html index.xhtml index.htm
    </IfModule>
    <IfModule mod_expires.c>
        ExpiresActive on
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/gif "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/vnd.microsoft.icon "access plus 1 month"
        ExpiresByType image/x-icon "access plus 1 month"
        ExpiresByType image/webp "access plus 1 month"
        ExpiresByType video/webm "access plus 1 month"
        ExpiresByType video/mp4 "access plus 1 month"
    </IfModule>
    Protocols h2 h2c http/1.1
    RewriteEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__CERT_NAME__/privkey.pem
</VirtualHost>
</IfModule>
