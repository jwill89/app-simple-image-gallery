version: '3'

# Day-to-day commands; `task` alone lists them. CI (.github/workflows/ci.yml) runs the same checks.

# The shared tasks, from the shared/ submodule (shared:lint:scripts, shared:lint:md,
# shared:update and the rest).
includes:
  shared: ./shared/repo/Taskfile.yml

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the backend's and frontend's dependencies (a fresh clone runs composer setup in backend/ first, for .env and APP_KEY)
    cmds:
      - cd backend && composer install
      - cd frontend && npm ci

  dev:
    desc: Run the Vite dev server on :5173; it sends /api and the media files to the backend at http://localhost (or GALLERY_BACKEND_URL)
    dir: frontend
    cmds:
      - npm run dev

  dev:backend:
    desc: Run the Laravel app with artisan serve on :8000
    dir: backend
    cmds:
      - composer dev

  gen:
    desc: Regenerate backend/openapi.json from the PHP attributes, then the frontend's API types from it
    cmds:
      - cd backend && composer docs
      - cd frontend && npm run gen:types

  build:
    desc: Type-check and build the SPA into frontend/dist
    dir: frontend
    cmds:
      - npm run build

  test:
    desc: Run the backend (Pest) and frontend (Vitest) tests
    aliases: [tests, test:unit, tests:unit]
    cmds:
      - task: test:backend
      - task: test:frontend

  test:backend:
    desc: Run the backend's Pest tests, including the contract replay
    aliases: [tests:backend]
    dir: backend
    cmds:
      - composer test

  test:frontend:
    desc: Run the frontend's Vitest tests
    aliases: [tests:frontend]
    dir: frontend
    cmds:
      - npm test

  test:e2e:
    desc: Run the end-to-end suite (Playwright and axe) on the built SPA and the API, on a throwaway database
    aliases: [tests:e2e]
    dir: frontend
    cmds:
      - npm run test:e2e

  lint:
    desc: Lint, format-check, and statically analyse everything
    cmds:
      - task: lint:backend
      - task: lint:frontend
      - task: lint:scripts
      - task: shared:lint:md
      - task: shared:repo:check
      - task: shared:version:check

  lint:backend:
    dir: backend
    cmds:
      - composer lint
      - composer rector:check
      - composer analyse

  lint:frontend:
    dir: frontend
    cmds:
      - npm run lint
      - npm run lint:css
      - npm run knip
      - npm run format:check

  # PSScriptAnalyzer, with the shared settings, on every tracked script (the local
  # deploy.config.ps1 is the owner's and untracked). Install it once with
  # Install-PSResource PSScriptAnalyzer -Version 1.25.0 -Scope CurrentUser -TrustRepository
  lint:scripts:
    cmds:
      - task: shared:lint:scripts

  vuln:
    desc: Check dependencies for known vulnerabilities
    cmds:
      - cd backend && composer audit
      - cd frontend && npm audit --audit-level=high --omit=dev
      - task: shared:vuln

  check:
    desc: Lint, audit, test, and build, as CI does (CI also checks the generated files are current)
    cmds:
      # The steps that don't depend on each other run at once, each line prefixed with
      # its task; the ones that need them follow, in order.
      - task --parallel --output prefixed lint vuln test
      - task: build
      - task: test:e2e

  push:
    desc: Take the in-range updates Dependabot would open, scan for advisories, run task check, then push (-- -Yes, -SkipUpdates, -SkipCheck)
    interactive: true
    cmds:
      - task: shared:push

  deploy:
    desc: Build the SPA and deploy it with the Laravel code, then migrate (pass flags after --, e.g. -- -SkipMigrate)
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 {{.CLI_ARGS}}
