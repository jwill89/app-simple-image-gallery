version: '3'

# Day-to-day commands; `task` alone lists them. CI (.github/workflows/ci.yml) runs the same checks.

# The shared tasks, from the shared/ submodule (shared:lint:scripts, shared:lint:md,
# shared:update and the rest).
includes:
  shared: ./shared/repo/Taskfile.yml

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the backend's and frontend's dependencies (a fresh clone runs composer setup in backend/ first, for .env and APP_KEY)
    cmds:
      - cd backend && composer install
      - cd frontend && npm ci

  dev:
    desc: Run the Vite dev server on :5173; it sends /api and the media files to the backend at http://localhost (or GALLERY_BACKEND_URL)
    dir: frontend
    cmds:
      - npm run dev

  dev:backend:
    desc: Run the Laravel app with artisan serve on :8000
    dir: backend
    cmds:
      - composer dev

  gen:
    desc: Regenerate backend/openapi.json from the PHP attributes, then the frontend's API types from it
    cmds:
      - cd backend && composer docs
      - cd frontend && npm run gen:types

  build:
    desc: Type-check and build the SPA into frontend/dist
    dir: frontend
    cmds:
      - npm run build

  test:
    desc: Run the backend (Pest) and frontend (Vitest) tests
    aliases: [tests, test:unit, tests:unit]
    cmds:
      - task: test:backend
      - task: test:frontend

  test:backend:
    desc: Run the backend's Pest tests, including the contract replay
    aliases: [tests:backend]
    dir: backend
    cmds:
      - composer test

  test:frontend:
    desc: Run the frontend's Vitest tests
    aliases: [tests:frontend]
    dir: frontend
    cmds:
      - npm test

  test:e2e:
    desc: Run the end-to-end suite (Playwright and axe) on the built SPA and the API, on a throwaway database
    aliases: [tests:e2e]
    dir: frontend
    cmds:
      - npm run test:e2e

  lint:
    desc: Lint, format-check and statically analyse the backend, the frontend and the scripts
    cmds:
      - task: lint:backend
      - task: lint:frontend
      - task: lint:scripts

  lint:backend:
    dir: backend
    cmds:
      - composer lint
      - composer rector:check
      - composer analyse

  lint:frontend:
    dir: frontend
    cmds:
      - npm run lint
      - npm run lint:css
      - npm run knip
      - npm run format:check

  # PSScriptAnalyzer, with the shared settings, on every tracked script (the local
  # deploy.config.ps1 is the owner's and untracked). Install it once with
  # Install-PSResource PSScriptAnalyzer -Version 1.25.0 -Scope CurrentUser -TrustRepository
  lint:scripts:
    cmds:
      - task: shared:lint:scripts

  vuln:
    desc: Check dependencies for known vulnerabilities
    cmds:
      - cd backend && composer audit
      - cd frontend && npm audit --audit-level=high --omit=dev
      - task: shared:vuln

  test:coverage:
    desc: Run the backend's Pest tests and the frontend's Vitest tests, each held to the coverage floor CI holds
    cmds:
      - cd backend && composer test:coverage
      - cd frontend && npm run test:coverage

  generate:check:
    desc: Fail if the committed OpenAPI document or the frontend's API types differ from what the code makes
    cmds:
      - cd backend && composer docs:check
      - cd frontend && npm run gen:check

  # The specs' tsconfig.vitest.json and their type-check, as web.yml runs them.
  web:specs:
    cmds:
      - task: shared:web:specs
        vars: { DIR: frontend }

  check:
    desc: Everything CI runs, so a green check means a green CI
    cmds:
      # The checks that don't depend on each other run at once, each line prefixed with
      # its task; the build and the end-to-end run follow, in order.
      - task --parallel --output prefixed lint shared:docs:check web:specs test:coverage generate:check vuln
      - task: build
      - task: test:e2e

  push:
    desc: Take the in-range updates Dependabot would open, push, and follow CI to its verdict (-- -Yes, -SkipUpdates, -NoWait); run task check first
    interactive: true
    cmds:
      - task: shared:push

  deploy:
    desc: Build the SPA and deploy it with the Laravel code, then migrate (pass flags after --, e.g. -- -SkipMigrate)
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 {{.CLI_ARGS}}
