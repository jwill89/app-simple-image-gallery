name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP / Slim)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.5']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # The ext-* composer.json requires (composer install refuses without them).
          extensions: pdo, pdo_sqlite, curl, fileinfo, gd, mbstring
          tools: composer
          coverage: pcov

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: backend/vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Dev packages included: they run here and on the droplet, whose deploy
      # installs them for Phinx.
      - name: Security advisories (composer audit)
        run: composer audit

      - name: Verify OpenAPI spec is current
        run: |
          composer docs
          git diff --exit-code openapi.json

      - name: composer.json is normalized
        run: composer normalize --dry-run

      - name: Dependencies declared and used (composer-unused, composer-require-checker)
        run: composer deps:check

      - name: Coding standard (PHP CS Fixer / PER-CS 3.0)
        run: composer lint

      - name: Current PHP idioms, no dead code (Rector)
        run: composer rector:check

      - name: Static analysis (PHPStan level 8 + strict and deprecation rules)
        run: composer analyse

      - name: Test (PHPUnit + coverage)
        run: composer test:coverage

  frontend:
    name: Frontend (Vue / Vite)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['26']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # frontend/eslint-config (shared @jwill89/eslint-config)
          # The default GITHUB_TOKEN can't read the private eslint-config repo, so
          # supply a PAT with read access to both repos (checkout reuses it for
          # submodule fetches on github.com). Falls back to GITHUB_TOKEN locally.
          token: ${{ secrets.ESLINT_CONFIG_TOKEN || github.token }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runtime packages only: what ships to the browser.
      - name: Security advisories (npm audit)
        run: npm audit --audit-level=high --omit=dev

      - name: Verify generated API types are current
        run: |
          npm run gen:types
          git diff --exit-code src/types/api.generated.ts

      - name: Lint (ESLint, type-checked, incl. template accessibility)
        run: npm run lint

      - name: Lint styles (Stylelint, incl. the palette rule)
        run: npm run lint:css

      - name: Unused files, exports and dependencies (Knip)
        run: npm run knip

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Type-check & build
        run: npm run build

      - name: Test (Vitest + coverage)
        run: npm run test:coverage

  # The deploy scripts, with PSScriptAnalyzer as PSScriptAnalyzerSettings.psd1 sets it.
  scripts:
    name: Scripts (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint the PowerShell scripts
        shell: pwsh
        run: |
          Install-PSResource PSScriptAnalyzer -Version 1.25.0 -Scope CurrentUser -TrustRepository -Quiet
          $found = foreach ($f in 'scripts/deploy.ps1', 'scripts/deploy.config.example.ps1') {
            Invoke-ScriptAnalyzer -Path $f -Settings PSScriptAnalyzerSettings.psd1
          }
          $found | Format-Table -AutoSize
          if ($found) { exit 1 }

  # On a push to the default branch, AFTER the gate passes, tag + release the
  # project version if it has no release yet. Tag = v<version> (frontend/
  # package.json); release body = the CHANGELOG "## [<version>]" section — so a
  # green version bump auto-publishes a release linked to its notes. Idempotent:
  # a version already released is skipped, so ordinary pushes are a no-op.
  release:
    name: Tag + release (on version bump)
    needs: [backend, frontend, scripts]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need existing tags to detect what's already released

      - name: Tag + release on version bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release.sh
