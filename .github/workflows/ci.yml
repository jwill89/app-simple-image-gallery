name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The shared workflows (shared-tooling, at the release the shared/ submodule holds; the
# docs job fails if the two ever differ), and the release this repo makes of its own.
jobs:
  # The Laravel backend. The contract recorded from the Slim app it replaced
  # (tests/Fixtures/contract/) is replayed by its tests.
  backend:
    uses: jwill89/shared-tooling/.github/workflows/php.yml@v1.1.1
    with:
      dir: backend
      php-version: '8.5'
      # The ext-* composer.json requires; Laravel's others are in setup-php's defaults.
      extensions: pdo, pdo_sqlite, curl, fileinfo, gd, mbstring
      coverage: pcov
      # Larastan and Pest boot the app, which reads .env and needs an APP_KEY.
      before: cp .env.example .env && php artisan key:generate
      # Advisories (dev packages included), the code style, Rector, Larastan, the OpenAPI
      # document the attributes make, then the tests with their coverage floor.
      commands: audit lint rector:check analyse docs:check test:coverage

  # The frontend's generated API types come from backend/openapi.json (gen:check).
  frontend:
    uses: jwill89/shared-tooling/.github/workflows/web.yml@v1.1.1
    with:
      dir: frontend
      scripts: gen:check lint lint:css knip format:check build test:coverage

  scripts:
    uses: jwill89/shared-tooling/.github/workflows/pwsh.yml@v1.1.1

  docs:
    uses: jwill89/shared-tooling/.github/workflows/docs.yml@v1.1.1

  # On a push to the default branch, AFTER the gate passes, tag + release the
  # project version if it has no release yet. Tag = v<version> (frontend/
  # package.json); release body = the CHANGELOG "## [<version>]" section, so a
  # green version bump auto-publishes a release linked to its notes. Idempotent:
  # a version already released is skipped, so ordinary pushes are a no-op.
  release:
    name: Tag + release (on version bump)
    needs: [backend, frontend, scripts, docs]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need existing tags to detect what's already released

      - name: Tag + release on version bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release.sh
