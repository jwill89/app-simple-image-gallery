# Weekly dependency updates, grouped so a quiet week is one pull request per ecosystem:
# minors and patches together, majors one by one (they can need code changes).
#
# Dependabot can't read Actions secrets, so the Font Awesome registry's token is also a
# Dependabot secret, FONTAWESOME_NPM_TOKEN (Settings, Secrets and variables, Dependabot).
version: 2

registries:
  # frontend/.npmrc names this registry for its scopes; Dependabot adds the token. No
  # `scope:`: with one, Dependabot writes its own .npmrc in place of the committed one,
  # which loses install-links=true, and npm ci then fails on the shared packages.
  fontawesome:
    type: npm-registry
    url: https://npm.fontawesome.com
    token: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      composer-minor:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    registries:
      - fontawesome
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Held on purpose: TypeScript stays on 6.x until vue-tsc supports TypeScript 7.1.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # vue-tsc 3.3.14 turns a `//` in a static attribute (placeholder="https://") into
      # broken virtual code, which stops it checking the rest of that template. Only
      # that version is skipped: the fix comes through.
      - dependency-name: vue-tsc
        versions: ['3.3.14']
      # The lint and format tools move to a new major once, together with the plugins
      # and configs that must match, and reach here with `task shared:update`; a
      # plugin of our own for one moves with it. Minors and patches still come here.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-*'
        update-types: ['version-update:semver-major']
      - dependency-name: prettier
        update-types: ['version-update:semver-major']
      - dependency-name: stylelint
        update-types: ['version-update:semver-major']
      - dependency-name: 'stylelint-*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
