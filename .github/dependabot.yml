# Weekly dependency updates, grouped so a quiet week is one pull request per ecosystem:
# minors and patches together, majors one by one (they can need code changes). The
# shape every repo follows (shared-tooling's repo/dependabot.example.yml). It would have
# raised November's Symfony advisories as a pull request before the audit failed CI.
version: 2

updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      composer-minor:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Held on purpose: TypeScript stays on 6.x until vue-tsc supports TypeScript 7.1.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # vue-tsc 3.3.14 turns a `//` in a static attribute (placeholder="https://") into
      # broken virtual code, which stops it checking the rest of that template
      # (vuejs/language-tools#6322; held at 3.3.13 on 2026-11-07). Only that version:
      # the fix comes through.
      - dependency-name: vue-tsc
        versions: ['3.3.14']
      # The tools shared-tooling's lint/web owns move to a new major once, in
      # shared-tooling, with the plugins and configs that must match, and reach here with
      # `task shared:update`; a plugin of our own for one moves with it. Minors and
      # patches still come here.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-*'
        update-types: ['version-update:semver-major']
      - dependency-name: prettier
        update-types: ['version-update:semver-major']
      - dependency-name: stylelint
        update-types: ['version-update:semver-major']
      - dependency-name: 'stylelint-*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
